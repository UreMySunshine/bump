name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python test_bump.py
      - name: Verify tag and build source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, runpy
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Use vMAJOR.MINOR.PATCH'
          assert tag == 'v' + runpy.run_path('bump')['VERSION'], 'Tag must match VERSION'
          PY
          mkdir dist
          git archive --format=tar.gz --prefix="bump-${RELEASE_TAG#v}/" HEAD > "dist/bump-${RELEASE_TAG#v}.tar.gz"
          cp homebrew-resources.json dist/
          (cd dist && sha256sum *.tar.gz homebrew-resources.json > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Bump $RELEASE_TAG" --generate-notes
